<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Inteligente de Brian</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
        }
        #chat-container { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .message { 
            padding: 10px 15px; 
            border-radius: 15px; 
            max-width: 80%; 
            word-wrap: break-word;
        }
        .user { 
            background-color: #007bff; 
            align-self: flex-end; 
        }
        .bot { 
            background-color: #333; 
            align-self: flex-start; 
        }
        #input-container { 
            padding: 15px; 
            display: flex; 
            gap: 10px; 
            background-color: #1e1e1e; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 20px; 
            background-color: #2a2a2a; 
            color: white; 
            outline: none;
        }
        button { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 20px; 
            background-color: #28a745; 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; padding: 10px; margin: 0; background-color: #1e1e1e; border-bottom: 1px solid #333;">🤖 Asistente de Brian</h2>
    
    <div id="chat-container">
        <div class="message bot">¡Hola Brian! Tu asistente web ya está configurado con tu clave privada. ¿En qué te ayudo hoy?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escribile a tu IA..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        // PEGA TU CLAVE COPIADA ENTRE LAS COMILLAS (Ejemplo: "hf_XyZ...")
        const HUGGINGFACE_TOKEN = "TU_TOKEN_DE_HUGGING_FACE_ACA";

        async function enviarMensaje() {
            const input = document.getElementById('user-input');
            const texto = input.value.trim();
            if (!texto) return;

            agregarMensaje(texto, 'user');
            input.value = '';

            const comando = texto.toLowerCase();
            if (comando.includes("prende la pc") || comando.includes("encender la pc")) {
                const msjPc = "🔧 Recibido. Enviando señal para encender tu PC de escritorio...";
                agregarMensaje(msjPc, 'bot');
                hablar(msjPc);
                return;
            }

            if (comando.includes("apaga la tele") || comando.includes("apagar la tele")) {
                const msjTele = "🔧 Entendido. Mandando señal para apagar la televisión...";
                agregarMensaje(msjTele, 'bot');
                hablar(msjTele);
                return;
            }

            try {
                // Usamos el ultra-veloz modelo Llama 3 de Meta alojado en tu cuenta de Hugging Face
                const response = await fetch("https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3-8B-Instruct", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${HUGGINGFACE_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: `<|begin_of_text|><|start_header_id|>system<|end_header_id|>\nEres un asistente de hogar inteligente para Brian. Responde de forma muy corta, amigable y siempre en español.<|eot_id|><|start_header_id|>user<|end_header_id|>\n${texto}<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n`,
                        parameters: { max_new_tokens: 150 }
                    })
                });

                const data = await response.json();
                
                // Procesamos el texto devuelto
                let textoCompleto = data[0].generated_text;
                let respuestaIA = textoCompleto.split("<|start_header_id|>assistant<|end_header_id|>\n")[1] || textoCompleto;
                respuestaIA = respuestaIA.replace("<|eot_id|>", "").trim();
                
                agregarMensaje(respuestaIA, 'bot');
                hablar(respuestaIA);

            } catch (error) {
                console.error("Error:", error);
                agregarMensaje("Tuve un problema al conectar con mi cerebro en la nube. Reintentá en un momento.", 'bot');
            }
        }

        function agregarMensaje(texto, remitente) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message ${remitente}`;
            div.innerText = texto;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function hablar(texto) {
            const synth = window.speechSynthesis;
            if (!synth) return;
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            synth.speak(utterance);
        }
    </script>
</body>
</html>
