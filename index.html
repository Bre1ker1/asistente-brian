<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Inteligente de Brian</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
        }
        #chat-container { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .message { 
            padding: 10px 15px; 
            border-radius: 15px; 
            max-width: 80%; 
            word-wrap: break-word;
        }
        .user { 
            background-color: #007bff; 
            align-self: flex-end; 
        }
        .bot { 
            background-color: #333; 
            align-self: flex-start; 
        }
        #input-container { 
            padding: 15px; 
            display: flex; 
            gap: 10px; 
            background-color: #1e1e1e; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 20px; 
            background-color: #2a2a2a; 
            color: white; 
            outline: none;
        }
        button { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 20px; 
            background-color: #28a745; 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; padding: 10px; margin: 0; background-color: #1e1e1e; border-bottom: 1px solid #333;">🤖 Asistente de Brian</h2>
    
    <div id="chat-container">
        <div class="message bot">¡Hola Brian! Tu asistente web ya está corregido y activo. ¿Qué hacemos hoy?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escribile a tu IA..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        async function enviarMensaje() {
    const input = document.getElementById('user-input');
    const texto = input.value.trim();
    if (!texto) return;

    agregarMensaje(texto, 'user');
    input.value = '';

    const comando = texto.toLowerCase();
    if (comando.includes("prende la pc") || comando.includes("encender la pc")) {
        const msjPc = "🔧 Recibido. Enviando señal para encender tu PC de escritorio...";
        agregarMensaje(msjPc, 'bot');
        hablar(msjPc);
        return;
    }

    if (comando.includes("apaga la tele") || comando.includes("apagar la tele")) {
        const msjTele = "🔧 Entendido. Mandando señal para apagar la televisión...";
        agregarMensaje(msjTele, 'bot');
        hablar(msjTele);
        return;
    }

    try {
        // Conexión a un modelo libre de Hugging Face que NO requiere claves ni tokens
        const response = await fetch("https://api-inference.huggingface.co/models/HuggingFaceH4/zephyr-7b-beta", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                inputs: `<|system|>\nEres un asistente de hogar inteligente para Brian. Responde de forma muy corta, clara y siempre en español.</s>\n<|user|>\n${texto}</s>\n<|assistant|>\n`,
                parameters: { max_new_tokens: 150, stop: ["</s>"] }
            })
        });

        const data = await response.json();
        
        // Limpiamos la respuesta para quedarnos solo con lo que dice la IA
        let respuestaIA = data[0].generated_text.split("<|assistant|>\n")[1] || data[0].generated_text;
        respuestaIA = respuestaIA.replace("</s>", "").trim();
        
        agregarMensaje(respuestaIA, 'bot');
        hablar(respuestaIA);

    } catch (error) {
        console.error("Error de conexión:", error);
        agregarMensaje("Tuve un problema al conectar con mi cerebro en la nube. Reintentá en un momento.", 'bot');
    }
}

        function agregarMensaje(texto, remitente) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message ${remitente}`;
            div.innerText = texto;
            container.appendChild(div);
            
            // Auto-scroll hacia abajo para ver el último mensaje
            container.scrollTop = container.scrollHeight;
        }

        function hablar(texto) {
            // Activa la síntesis de voz nativa del dispositivo (Celular o PC)
            const synth = window.speechSynthesis;
            if (!synth) return;
            
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES'; // Configurado en español básico
            synth.speak(utterance);
        }
    </script>
</body>
</html>
