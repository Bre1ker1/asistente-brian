<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Inteligente de Brian</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; }
        .user { background-color: #007bff; align-self: flex-end; }
        .bot { background-color: #333; align-self: flex-start; }
        #input-container { padding: 15px; display: flex; gap: 10px; background-color: #1e1e1e; }
        input { flex: 1; padding: 12px; border: none; border-radius: 20px; background-color: #2a2a2a; color: white; }
        button { padding: 12px 20px; border: none; border-radius: 20px; background-color: #28a745; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <h2 style="text-align: center; padding: 10px; margin: 0; background-color: #1e1e1e;">🤖 Asistente de Brian</h2>
    
    <div id="chat-container">
        <div class="message bot">¡Hola Brian! Tu asistente web ya está activo. ¿Qué hacemos hoy?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escribile a tu IA...">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        const GROQ_API_KEY = "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";

        async function enviarMensaje() {
            const input = document.getElementById('user-input');
            const texto = input.value.trim();
            if (!texto) return;

            agregarMensaje(texto, 'user');
            input.value = '';

            // Comandos rápidos de hardware
            if(texto.toLowerCase().includes("prende la pc")) {
                agregarMensaje("🔧 Recibido. Enviando señal para encender tu PC...", 'bot');
                hablar("Recibido. Enviando señal para encender tu PC de escritorio.");
                return;
            }

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [
                            { role: "system", content: "Eres un asistente de hogar para Brian. Responde corto y amigable." },
                            { role: "user", content: texto }
                        ]
                    })
                });

                const data = await response.json();
                const respuestaIA = data.choices[0].message.content;
                
                agregarMensaje(respuestaIA, 'bot');
                hablar(respuestaIA);

            } catch (error) {
                agregarMensaje("Error al conectar con la IA.", 'bot');
            }
        }

        function agregarMensaje(texto, remitente) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message ${remitente}`;
            div.innerText = texto;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function hablar(texto) {
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            synth.speak(utterance);
        }
    </script>
</body>
</html>
